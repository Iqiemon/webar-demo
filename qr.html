<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR codes · WebAR Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
  <script type="module" src="js/qr-sheet.js"></script>
</head>
<body>
  <header class="bar no-print">
    <a href="index.html" class="back">← Demo home</a>
    <span class="badge">QR codes</span>
  </header>

  <main>
    <div class="no-print sheet-controls">
      <h1>Printable QR codes</h1>
      <label for="base">Site address the codes should open</label>
      <input id="base" type="url" inputmode="url" autocomplete="off" spellcheck="false">
      <p id="base-error" class="local-warning" hidden>Enter a full address starting with https://</p>
      <p class="muted">Print this page, or download each code as SVG (for print) or PNG.</p>
    </div>
    <div id="sheet" class="sheet"></div>
  </main>

  <template id="qr-item-tpl">
    <figure class="qr-item">
      <figcaption class="qr-label"></figcaption>
      <div class="qr"></div>
      <p class="qr-url"></p>
      <div class="qr-actions no-print">
        <button type="button" class="chip dl-svg">SVG</button>
        <button type="button" class="chip dl-png">PNG</button>
      </div>
    </figure>
  </template>
</body>
</html>
